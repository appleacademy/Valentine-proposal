<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For COCO 💖</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .container {
        background: white;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        text-align: center;
        width: min(90%, 340px);
        position: relative;
        overflow: hidden;
    }

    h1 {
        color: #ff3366;
        min-height: 80px;
        font-size: 1.4rem;
    }

    .name {
        color: #ff3366;
        font-weight: bold;
    }

    .btn-area {
        position: relative;
        height: 80px;
        margin-top: 10px;
    }

    button {
        padding: 10px 22px;
        font-size: 16px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        position: absolute;
    }

    #yesBtn {
        background: #ff3366;
        color: white;
        left: 20px;
        bottom: 0;
    }

    #noBtn {
        background: #555;
        color: white;
        right: 20px;
        bottom: 0;
    }

    #result {
        display: none;
    }

    #result img {
        width: 200px;
        margin-top: 15px;
    }

    /* Fireworks */
    .firework {
        position: fixed;
        width: 10px;
        height: 10px;
        background: gold;
        border-radius: 50%;
        animation: explode 1s ease-out forwards;
        z-index: 9999;
    }

    @keyframes explode {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(5); opacity: 0; }
    }

    /* Hearts */
    .heart {

        font-size: 24px;
        animation: floatUp 4s linear forwards;
        z-index: 9999;
    }
